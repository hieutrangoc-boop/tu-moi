    function getActiveCompounds(item) {
      if (!item) return [];
      const cached = getCachedRoots(item);
      if (!cached || !Array.isArray(cached.compounds)) return [];

      const all = cached.compounds.filter(c => c && c.vi);
      const available = all.filter(c => !isCompoundKnown(c.vi));

      const itemId = item.id || cleanVietnameseWord(item.vi);
      let slots = activeLegoSlots[itemId];

      if (!slots || !Array.isArray(slots) || slots.length === 0) {
        slots = available.slice(0, 3);
        activeLegoSlots[itemId] = slots;
        return slots;
      }

      // If any slot is in knownCompounds, replace it
      for (let i = 0; i < slots.length; i++) {
        const s = slots[i];
        if (!s || isCompoundKnown(s.vi)) {
          const usedVis = new Set(slots.filter((x, idx) => idx !== i && x && x.vi).map(x => cleanVietnameseWord(x.vi)));
          const targetRoot = s && s.root ? cleanVietnameseWord(s.root) : '';

          let nextCand = available.find(c => {
            const cVi = cleanVietnameseWord(c.vi);
            return !usedVis.has(cVi) && targetRoot && cleanVietnameseWord(c.root) === targetRoot;
          });
          if (!nextCand) {
            nextCand = available.find(c => {
              const cVi = cleanVietnameseWord(c.vi);
              return !usedVis.has(cVi);
            });
          }
          if (nextCand) {
            slots[i] = nextCand;
          } else {
            slots.splice(i, 1);
            i--;
          }
        }
      }

      // Fill up to 3 if more un-known candidates are available
      while (slots.length < Math.min(3, available.length)) {
        const usedVis = new Set(slots.map(x => cleanVietnameseWord(x.vi)));
        const cand = available.find(c => !usedVis.has(cleanVietnameseWord(c.vi)));
        if (cand) {
          slots.push(cand);
        } else {
          break;
        }
      }

      activeLegoSlots[itemId] = slots;
      return slots;
    }

    async function onSwapLegoWord(item, vi, root, slotIdx, btn) {
      if (!item || !vi) return;
      const normVi = cleanVietnameseWord(vi);
      knownCompounds.add(normVi);
      saveLocalKnownCompounds();
      fetch('/api/tu-moi/mark-known', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ vi })
      }).catch(() => {});

      const itemId = item.id || cleanVietnameseWord(item.vi);
      const cached = getCachedRoots(item);
      const all = (cached && Array.isArray(cached.compounds)) ? cached.compounds : [];
      const available = all.filter(c => !isCompoundKnown(c.vi));
      let slots = activeLegoSlots[itemId] || [];
      const usedVis = new Set(slots.filter((_, idx) => idx !== slotIdx).map(x => cleanVietnameseWord(x.vi)));
      const targetRoot = root ? cleanVietnameseWord(root) : '';

      let nextCand = available.find(c => {
        const cVi = cleanVietnameseWord(c.vi);
        return !usedVis.has(cVi) && targetRoot && cleanVietnameseWord(c.root) === targetRoot;
      });
      if (!nextCand) {
        nextCand = available.find(c => !usedVis.has(cleanVietnameseWord(c.vi)));
      }

      if (nextCand) {
        slots[slotIdx] = nextCand;
        activeLegoSlots[itemId] = slots;
        render(true);
        return;
      }

      if (btn) {
        btn.disabled = true;
        btn.textContent = '...';
      }

      try {
        const res = await fetch('/api/tu-moi/exchange-compound', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            word_id: item.id,
            word_vi: item.vi,
            root: root,
            exclude: Array.from(knownCompounds)
          })
        });
        const data = res.ok ? await res.json() : null;
        const newComps = data && Array.isArray(data.compounds) ? data.compounds : [];
        if (newComps.length > 0) {
          if (cached && Array.isArray(cached.compounds)) {
            newComps.forEach(nc => {
              if (!cached.compounds.some(c => cleanVietnameseWord(c.vi) === cleanVietnameseWord(nc.vi))) {
                cached.compounds.push(nc);
              }
            });
            saveLocalRootsCache();
          }
          slots[slotIdx] = newComps[0];
          activeLegoSlots[itemId] = slots;
          render(true);
        } else {
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Hết từ';
            setTimeout(() => { if (btn) btn.textContent = '↻ Đổi'; }, 1500);
          }
        }
      } catch (err) {
        console.warn('Error exchanging compound:', err);
        if (btn) {
          btn.disabled = false;
          btn.textContent = '↻ Đổi';
        }
      }
    }

    function getCachedRoots(item) {
      if (!item) return null;
      if (item.id && rootsCache[item.id]) {
        return rootsCache[item.id];
      }
      const cleanVi = cleanVietnameseWord(item.vi);
      if (cleanVi && rootsCache[cleanVi]) {
        return rootsCache[cleanVi];
      }
      for (const key of Object.keys(rootsCache)) {
        if (cleanVietnameseWord(key) === cleanVi && rootsCache[key]) {
          return rootsCache[key];
        }
      }
      return null;
    }

    function renderRootsBox(item) {
      if (!rootsVisible) return '';
      if (rootsLoading) {
        return `
          <div class="roots-box">
            <div class="context-loading">Đang phân tích gốc từ...</div>
          </div>
        `;
      }
      if (rootsError) {
        return `
          <div class="roots-box">
            <div class="context-error">${escapeHtml(rootsError)}</div>
          </div>
        `;
      }
      const cached = getCachedRoots(item);
      if (!cached) {
        return `
          <div class="roots-box">
            <div class="context-error">Chưa có thông tin gốc từ cho từ này.</div>
          </div>
        `;
      }

      const etymology = cached.etymology || {};
      const roots = Array.isArray(etymology.roots) ? etymology.roots : (Array.isArray(cached.roots) ? cached.roots : []);
      const bridge = etymology.bridge || cached.bridge || '';
      const compounds = Array.isArray(cached.compounds) ? cached.compounds : [];

      if (roots.length === 0 && !bridge && compounds.length === 0) {
        return `
          <div class="roots-box">
            <div class="context-error">Chưa có thông tin gốc từ cho từ này.</div>
          </div>
        `;
      }

      let html = '<div class="roots-box" id="roots-box">';

      if (roots.length > 0) {
        html += `
          <div class="roots-section">
            <div class="roots-section-title">Gốc từ</div>
            <div class="roots-pills">
              ${roots.map(r => `
                <div class="root-pill">
                  <span class="root-pill-vi" lang="vi">${escapeHtml(r.vi || '')}</span>
                  <span class="root-pill-sep">·</span>
                  <span class="root-pill-meaning">${escapeHtml(r.meaning || '')}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (bridge) {
        html += `
          <div class="roots-section">
            <div class="roots-section-title">Ý nghĩa gốc</div>
            <div class="roots-bridge">
              <span class="roots-bridge-icon">💡</span>
              <span class="roots-bridge-text">${escapeHtml(bridge)}</span>
            </div>
          </div>
        `;
      }

      const displayedCompounds = getActiveCompounds(item);

      if (displayedCompounds.length > 0) {
        html += `
          <div class="roots-section">
            <div class="roots-section-title">Từ liên quan (Linguistic Lego)</div>
            <div class="compounds-list">
              ${displayedCompounds.map((cp, slotIdx) => {
                const alreadyInWords = isWordInList(cp.vi);
                return `
                  <div class="compound-item" data-slot="${slotIdx}">
                    <div class="compound-info">
                      <div class="compound-vi-line">
                        <span class="compound-vi" lang="vi">${escapeHtml(cp.vi || '')}</span>
                        ${cp.literal ? `<span class="compound-literal">(${escapeHtml(cp.literal)})</span>` : ''}
                      </div>
                      ${cp.en ? `<div class="compound-en" lang="en">${escapeHtml(cp.en)}</div>` : ''}
                    </div>
                    <div class="compound-action">
                      ${alreadyInWords ? `
                        <button type="button" class="compound-add-btn is-added" disabled title="Từ này đã có trong danh sách học">✓ Đã có</button>
                      ` : `
                        <button type="button" class="compound-add-btn" data-vi="${escapeHtml(cp.vi || '')}" data-en="${escapeHtml(cp.en || '')}" title="Thêm vào danh sách học">+ Thêm</button>
                      `}
                      <button type="button" class="compound-swap-btn" data-slot="${slotIdx}" data-vi="${escapeHtml(cp.vi || '')}" data-root="${escapeHtml(cp.root || '')}" title="Đã biết từ này, đổi từ khác">↻ Đổi</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else if (compounds.length > 0) {
        html += `
          <div class="roots-section">
            <div class="roots-section-title">Từ liên quan (Linguistic Lego)</div>
            <div class="context-loading" style="text-align:left; font-size:12.5px;">Bạn đã đánh dấu biết tất cả từ gợi ý cho gốc từ này.</div>
          </div>
        `;
      }

      html += '</div>';
      return html;
    }

    async function toggleRoots() {
      const queue = progress.today ? progress.today.queue : [];
      if (!queue || queue.length === 0) return;
      const currentId = queue[0];
      const studyMode = isStudyCard(currentId);
      if (!revealed && !studyMode) return;

      if (rootsVisible) {
        rootsVisible = false;
        render(true);
        return;
      }

      rootsVisible = true;
      contextVisible = false;
      const item = wordMap.get(currentId);
      if (!item) {
        render(true);
        return;
      }

      const cached = getCachedRoots(item);
      if (cached) {
        rootsLoading = false;
        rootsError = null;
        render(true);
        return;
      }

      rootsLoading = true;
      rootsError = null;
      render(true);

      try {
        const res = await fetch('/api/tu-moi/roots', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: item.id, vi: item.vi, en: item.en })
        });
        if (!res.ok) throw new Error('API returned ' + res.status);
        const data = await res.json();
        if (data && data.roots_data) {
          if (item.id) rootsCache[item.id] = data.roots_data;
          const cleanVi = cleanVietnameseWord(item.vi);
          if (cleanVi) rootsCache[cleanVi] = data.roots_data;
          saveLocalRootsCache();
          rootsLoading = false;
          rootsError = null;
        } else {
          throw new Error('Invalid format');
        }
      } catch (err) {
        console.warn('Roots fetch error:', err);
        rootsLoading = false;
        rootsError = 'Không thể tải gốc từ lúc này.';
      }

      const curQueue = progress.today ? progress.today.queue : [];
      if (curQueue && curQueue[0] === currentId && rootsVisible) {
        render(true);
      }
    }

    async function onAddLegoWord(vi, en, btn) {
      if (!vi || !btn) return;
      btn.disabled = true;
      btn.textContent = '...';
      try {
        const res = await fetch('/api/tu-moi/add-word', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ vi, en })
        });
        const data = res.ok ? await res.json() : null;
        const newItem = (data && data.item) || {
          id: 'w_' + Math.random().toString(36).slice(2, 10),
          vi,
          en,
          en_from: 'lego',
          date: localDateStr()
        };
        if (!words.some(w => cleanVietnameseWord(w.vi) === cleanVietnameseWord(newItem.vi))) {
          words.push(newItem);
          wordMap.set(newItem.id, newItem);
          saveWords(words);
        }
        btn.className = 'compound-add-btn is-added';
        btn.textContent = '✓ Đã thêm';
        btn.title = 'Đã thêm vào danh sách học';
      } catch (err) {
        console.warn('Error adding word:', err);
        btn.disabled = false;
        btn.textContent = '+ Thêm';
      }
    }

    function onStudyContinue() {
      if (!progress.today || progress.today.queue.length === 0) return;
      const todayStr = localDateStr();
      if (progress.today.date !== todayStr || (renderedCardId && progress.today.queue[0] !== renderedCardId)) {
        syncTodayPlan();
        resetTransientCardState();
        render();
        return;
      }
      const id = progress.today.queue.shift();
      progress.today.studied[id] = true;
      const pos = Math.min(4, progress.today.queue.length);
      progress.today.queue.splice(pos, 0, id);
      resetTransientCardState();
      saveProgress();
      render();
    }

    function onReveal(currentTyped) {
      const todayStr = localDateStr();
      if (!progress.today || progress.today.queue.length === 0 || progress.today.date !== todayStr || progress.today.queue[0] !== renderedCardId) {
        syncTodayPlan();
        resetTransientCardState();
        render();
        return;
      }
      resetTransientCardState();
      typedValue = currentTyped;
      revealed = true;
      const currentId = progress.today.queue[0];
      const item = wordMap.get(currentId);
      if (item && item.vi) {
        lastAccuracy = checkAccuracy(item.vi, currentTyped);
        if (lastAccuracy) {
          playRecallSound(lastAccuracy);
        }
      }
      if (lastAccuracy === 'full') {
        selectedGradeIndex = 2; // Good (fully correct)
      } else {
        selectedGradeIndex = 0; // Again (wrong, partial/missing diacritics, or blank)
      }
      render();
    }

    function updateGradeSelection(newIndex) {
      selectedGradeIndex = Math.max(0, Math.min(2, newIndex));
      const buttons = [
        document.getElementById('btn-again'),
        document.getElementById('btn-hard'),
        document.getElementById('btn-good')
      ];
      buttons.forEach((btn, idx) => {
        if (!btn) return;
        if (idx === selectedGradeIndex) {
          btn.classList.add('is-active');
          btn.focus();
        } else {
          btn.classList.remove('is-active');
        }
      });
    }

    function onGrade(grade) {
      if (!progress.today || progress.today.queue.length === 0) return;
      const now = new Date();
      const todayStr = localDateStr(now);
      if (progress.today.date !== todayStr || (renderedCardId && progress.today.queue[0] !== renderedCardId)) {
        syncTodayPlan();
        resetTransientCardState();
        render();
        return;
      }
      const id = progress.today.queue.shift();

      progress.today.studied[id] = true;

      if (!progress.today.firstGrade[id]) {
        progress.today.firstGrade[id] = grade;
        const rating = grade === 'again' ? Rating.Again : grade === 'hard' ? Rating.Hard : Rating.Good;
        const currentCard = progress.cards[id] ? reviveCard(progress.cards[id]) : createEmptyCard(now);
        progress.cards[id] = scheduler.next(currentCard, now, rating).card;
      }

      resetTransientCardState();

      if (grade === 'again') {
        const pos = Math.min(5, progress.today.queue.length);
        progress.today.queue.splice(pos, 0, id);
        saveProgress();
        render();
        return;
      }

      let finishedNow = false;
      if (!progress.today.done.includes(id)) {
        progress.today.done.push(id);
        progress.days[todayStr] = (progress.days[todayStr] || 0) + 1;
        finishedNow = true;
      }

      saveProgress();

      if (finishedNow) {
        const countToday = progress.days[todayStr] || 0;
        const weekInfo = getWeekInfo();
        playFinishSound(countToday, weekInfo.fullWeek);

        if (countToday > 0 && countToday % 10 === 0) {
          roundCelebrate = true;
          animateNewBlock = true;
          if (countToday === 10) {
            animateStreakPop = true;
          }
          if (celebrateTimer) clearTimeout(celebrateTimer);
          celebrateTimer = setTimeout(() => {
            roundCelebrate = false;
            render(true);
          }, 1400);

          const totalWeeklyRounds = weekInfo.cols.reduce((sum, col) => sum + col.rounds, 0);
          if (totalWeeklyRounds > 0 && totalWeeklyRounds % 7 === 0) {
            rewardCelebrate = true;
            playRewardPotChime();
            if (rewardCelebrateTimer) clearTimeout(rewardCelebrateTimer);
            rewardCelebrateTimer = setTimeout(() => {
              rewardCelebrate = false;
              render(true);
            }, 1800);
          }
        }
      }

      render();
    }

    function startNextRound(extraCount = 10) {
      if (celebrateTimer) {
        clearTimeout(celebrateTimer);
        celebrateTimer = null;
      }
      roundCelebrate = false;

      if (!words || words.length === 0) return;
      if (wordMap.size === 0) {
        wordMap = new Map(words.map(w => [w.id, w]));
      }

      const now = new Date();
      const todayStr = localDateStr(now);
      if (!progress.today || progress.today.date !== todayStr) {
        syncTodayPlan();
        revealed = false;
        typedValue = '';
        render();
        return;
      }

      const inQueue = new Set(progress.today.queue);
      const unseen = words.filter(w => !progress.cards[w.id] && !inQueue.has(w.id));

      if (unseen.length > 0) {
        const lastId = progress.today.queue[progress.today.queue.length - 1];
        const lastDate = lastId && wordMap.has(lastId) ? wordMap.get(lastId).date : null;
        const countToAdd = Math.min(extraCount, unseen.length);
        const added = pickNewWordsAlternatingDates(unseen, countToAdd, lastDate);
        for (const w of added) {
          progress.cards[w.id] = createEmptyCard(now);
          progress.newDays[todayStr] = (progress.newDays[todayStr] || 0) + 1;
          progress.today.queue.push(w.id);
        }
      } else {
        const reviewCandidates = words
          .filter(w => progress.cards[w.id] && !inQueue.has(w.id))
          .sort((a, b) => {
            const dueA = new Date(progress.cards[a.id].due || 0).getTime();
            const dueB = new Date(progress.cards[b.id].due || 0).getTime();
            return dueA - dueB;
          })
          .slice(0, extraCount);

        for (const w of reviewCandidates) {
          progress.today.queue.push(w.id);
          if (progress.today.done) {
            const idx = progress.today.done.indexOf(w.id);
            if (idx >= 0) progress.today.done.splice(idx, 1);
          }
          if (progress.today.firstGrade) {
            delete progress.today.firstGrade[w.id];
          }
        }
      }

      resetTransientCardState();
      saveProgress();
      render();
    }
    window.startNextRound = startNextRound;

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function render(preserveFocus = false) {
      const root = document.getElementById('card-root');
      if (!root) return;

      let prevInputVal = '';
      if (preserveFocus) {
        const existingInput = document.getElementById('answer-input');
        if (existingInput) prevInputVal = existingInput.value;
      }

      if (words.length === 0) {
        renderedCardId = null;
        resetTransientCardState();
        root.className = 'card';
        root.innerHTML = `
          <div class="header-row">
            <h1 class="title" lang="vi">Từ mới</h1>
          </div>
          <div class="empty-words">No words yet.</div>
        `;
        return;
      }

      const now = new Date();
      const todayStr = localDateStr(now);
      if (!progress.today || progress.today.date !== todayStr) {
        syncTodayPlan();
      }

      const queue = progress.today ? progress.today.queue : [];
      const nextCardId = queue.length > 0 ? queue[0] : null;
      if (nextCardId !== renderedCardId) {
        resetTransientCardState();
        prevInputVal = '';
      }
      renderedCardId = nextCardId;
      const cardsLeft = queue.length;
      const week = getWeekInfo();

      root.className = roundCelebrate ? 'card round-glow' : 'card';

      const streakHtml = week.streak > 0 ? `
        <span class="streak-badge${week.todayHasRound ? '' : ' pending-today'}${animateStreakPop ? ' pop' : ''}" title="${week.streak} days in a row">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8.6 1.2c.2 1.8-.7 3.1-1.8 4.3-1.2 1.3-2.3 2.5-2.3 4.4 0 1.9 1.4 3.6 3.5 3.9-.8-.6-1.2-1.5-1.2-2.5 0-1.4 1-2.4 1.9-3.4.7-.8 1.4-1.6 1.5-2.8 1.5 1.2 2.5 2.9 2.5 4.9 0 2.9-2.1 5-4.8 5S3 12.9 3 10c0-2.6 1.5-4.4 3-6 1.1-1.1 2.1-2.1 2.6-2.8z"/></svg>
          <span>${week.streak}</span>
        </span>
      ` : '';

      let panelHtml = '';
      let controlsHtml = '';
      let focusTarget = null;

      if (cardsLeft === 0) {
        const unseen = words.filter(w => !progress.cards[w.id]);
        const nextCount = Math.min(10, unseen.length);
        const btnText = unseen.length > 0 ? `Học thêm ${nextCount} từ` : 'Ôn tập lại';
        panelHtml = `
          <div class="card-panel">
            <div class="prompt-main" lang="vi">Xong</div>
          </div>
        `;
        controlsHtml = `
          <div class="answer-row">
            <button type="button" class="primary-btn full" id="btn-xong-tiep" lang="vi">${btnText}</button>
          </div>
        `;
        focusTarget = 'btn-xong-tiep';
      } else {
        const currentId = queue[0];
        const item = wordMap.get(currentId);
        const studyMode = isStudyCard(currentId);

        if (studyMode) {
          const contextTriggerHtml = `
            <div class="context-trigger-row">
              <button type="button" class="context-btn${contextVisible ? ' is-open' : ''}" id="btn-context" aria-expanded="${contextVisible}" title="Xem ví dụ câu (C)">
                Ví dụ <span class="context-hint">C</span>
              </button>
              <button type="button" class="context-btn${rootsVisible ? ' is-open' : ''}" id="btn-roots" aria-expanded="${rootsVisible}" title="Xem gốc từ & từ liên quan (R)">
                Gốc từ <span class="context-hint">R</span>
              </button>
            </div>
            ${renderContextBox(item)}
            ${renderRootsBox(item)}
          `;
          panelHtml = `
            <div class="card-panel">
              <div class="prompt-main" lang="vi">${escapeHtml(item.vi)}</div>
              <div class="prompt-sub" lang="en">${escapeHtml(item.en)}</div>
              ${contextTriggerHtml}
            </div>
          `;
          controlsHtml = `
            <div class="answer-row">
              <button type="button" class="primary-btn full" id="btn-tiep" lang="vi">Tiếp</button>
            </div>
          `;
          focusTarget = 'btn-tiep';
        } else if (!revealed) {
          panelHtml = `
            <div class="card-panel">
              <div class="prompt-main" lang="en">${escapeHtml(item.en)}</div>
            </div>
          `;
          controlsHtml = `
            <form class="answer-row" id="answer-form" autocomplete="off">
              <input
                type="text"
                class="answer-input"
                id="answer-input"
                lang="vi"
                aria-label="Vietnamese"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
              >
              <button type="submit" class="primary-btn${prevInputVal.trim() ? '' : ' is-skip'}" id="btn-hien" lang="vi">${prevInputVal.trim() ? 'Hiện' : 'Bỏ qua'}</button>
            </form>
          `;
          focusTarget = 'answer-input';
        } else {
          const trimmedTyped = typedValue.trim();
          let echoClass = 'typed-echo';
          if (lastAccuracy === 'full') {
            echoClass += ' match-full';
          } else if (lastAccuracy === 'partial') {
            echoClass += ' match-partial';
          } else {
            echoClass += trimmedTyped ? ' match-none' : '';
          }

          const contextTriggerHtml = `
            <div class="context-trigger-row">
              <button type="button" class="context-btn${contextVisible ? ' is-open' : ''}" id="btn-context" aria-expanded="${contextVisible}" title="Xem ví dụ câu (C)">
                Ví dụ <span class="context-hint">C</span>
              </button>
              <button type="button" class="context-btn${rootsVisible ? ' is-open' : ''}" id="btn-roots" aria-expanded="${rootsVisible}" title="Xem gốc từ & từ liên quan (R)">
                Gốc từ <span class="context-hint">R</span>
              </button>
            </div>
            ${renderContextBox(item)}
            ${renderRootsBox(item)}
          `;

          const rewardClass = lastAccuracy === 'full' ? ' panel-reward-full' : (lastAccuracy === 'partial' ? ' panel-reward-partial' : '');
          const accuracyIcon = lastAccuracy === 'full'
            ? `<span class="accuracy-mark check" aria-label="Đúng hoàn toàn">✓</span>`
            : (lastAccuracy === 'partial' ? `<span class="accuracy-mark partial" aria-label="Thiếu dấu">~</span>` : '');

          panelHtml = `
            <div class="card-panel revealed${rewardClass}">
              <div class="prompt-revealed-row">
                <span class="prompt-main" lang="vi">${escapeHtml(item.vi)}</span>
                ${item.en ? `<span class="prompt-en-beside" lang="en">· ${escapeHtml(item.en)}</span>` : ''}
              </div>
              ${trimmedTyped ? `<div class="${echoClass}" lang="vi">${accuracyIcon}<span>${escapeHtml(trimmedTyped)}</span></div>` : `<div class="typed-echo skipped" lang="vi"><span>(Bỏ qua)</span></div>`}
              ${contextTriggerHtml}
            </div>
          `;
          controlsHtml = `
            <div class="grade-row">
              <button type="button" class="grade-btn grade-again ${selectedGradeIndex === 0 ? 'is-active' : ''}" id="btn-again">
                <span class="grade-hint">J &larr;</span> Again
              </button>
              <button type="button" class="grade-btn grade-hard ${selectedGradeIndex === 1 ? 'is-active' : ''}" id="btn-hard">
                Hard
              </button>
              <button type="button" class="grade-btn grade-good ${selectedGradeIndex === 2 ? 'is-active' : ''}" id="btn-good">
                Good <span class="grade-hint">&rarr; L</span>
              </button>
            </div>
          `;
          const focusTargets = ['btn-again', 'btn-hard', 'btn-good'];
          focusTarget = focusTargets[selectedGradeIndex] || 'btn-again';
        }
      }

      const rawDoneToday = progress.days[todayStr] || 0;
      const pipVal = roundCelebrate ? 10 : (rawDoneToday % 10);
      let pipsInner = '';
      for (let i = 0; i < 10; i++) {
        pipsInner += `<div class="pip${i < pipVal ? ' filled' : ''}"></div>`;
      }

      const weekColsHtml = week.cols.map(col => {
        let blocksHtml = '';
        const maxVisible = 5;
        const visibleRounds = Math.min(col.rounds, maxVisible);
        for (let b = 0; b < visibleRounds; b++) {
          const isNewestToday = col.isToday && b === visibleRounds - 1 && animateNewBlock;
          blocksHtml += `<div class="round-block${isNewestToday ? ' drop-in' : ''}"></div>`;
        }
        if (col.rounds > maxVisible) {
          blocksHtml += `<span class="round-overflow-badge" aria-label="${col.rounds} rounds">${col.rounds}</span>`;
        }
        const letterClasses = [
          'day-letter',
          week.streakSet.has(col.index) ? 'in-streak' : '',
          col.isToday ? 'is-today' : ''
        ].filter(Boolean).join(' ');

        return `
          <div class="day-col" title="${col.name}: ${col.rounds} rounds">
            <div class="day-stack">${blocksHtml}</div>
            <div class="${letterClasses}">${col.letter}</div>
          </div>
        `;
      }).join('');

      const rewardPot = getRewardPotInfo(week);
      const isRewardUnlocked = rewardPot.rewardsEarned > 0;
      const rewardPotHtml = isRewardUnlocked ? `
        <div class="reward-pot-row${rewardCelebrate ? ' pot-glow' : ''}">
          <button type="button" class="reward-pot-text is-unlocked" id="btn-open-reward" title="Chiêm ngưỡng tác phẩm nghệ thuật mở khóa" aria-label="Mở phần thưởng tác phẩm nghệ thuật">
            <span class="reward-pot-icon" aria-hidden="true">🎁</span>
            <span>${escapeHtml(rewardPot.text)}</span>
          </button>
        </div>
      ` : `
        <div class="reward-pot-row${rewardCelebrate ? ' pot-glow' : ''}">
          <span class="reward-pot-text">
            <span class="reward-pot-icon" aria-hidden="true">🎁</span>
            <span>${escapeHtml(rewardPot.text)}</span>
          </span>
        </div>
      `;

      root.innerHTML = `
        <div class="header-row">
          <h1 class="title" lang="vi">Từ mới</h1>
          ${streakHtml}
          <span class="cards-left">${cardsLeft}</span>
        </div>
        ${panelHtml}
        ${controlsHtml}
        <div class="round-row${roundCelebrate ? ' sage-complete' : ''}">
          <div class="pips" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${pipVal}" aria-label="Round progress">
            ${pipsInner}
          </div>
          <span class="round-count">${pipVal} / 10</span>
        </div>
        <div class="week-row">
          ${weekColsHtml}
        </div>
        ${rewardPotHtml}
      `;

      animateNewBlock = false;
      animateStreakPop = false;

      const btnTiep = document.getElementById('btn-tiep');
      if (btnTiep) {
        btnTiep.addEventListener('click', onStudyContinue);
      }

      const btnXongTiep = document.getElementById('btn-xong-tiep');
      if (btnXongTiep) {
        btnXongTiep.addEventListener('click', () => startNextRound(10));
      }

      const btnOpenReward = document.getElementById('btn-open-reward');
      if (btnOpenReward) {
        const triggerOpenModal = (e) => {
          e.preventDefault();
          window.openArtRewardModal();
        };
        btnOpenReward.addEventListener('click', triggerOpenModal);
        btnOpenReward.addEventListener('touchend', triggerOpenModal);
      }

      const answerForm = document.getElementById('answer-form');
      const answerInput = document.getElementById('answer-input');
      const btnHien = document.getElementById('btn-hien');
      if (answerInput && preserveFocus && prevInputVal) {
        answerInput.value = prevInputVal;
      }
      if (answerInput && btnHien) {
        const updateBtn = () => {
          const hasText = answerInput.value.trim().length > 0;
          btnHien.textContent = hasText ? 'Hiện' : 'Bỏ qua';
          if (hasText) {
            btnHien.classList.remove('is-skip');
          } else {
            btnHien.classList.add('is-skip');
          }
        };
        answerInput.addEventListener('input', updateBtn);
        updateBtn();
      }
      if (answerForm && answerInput) {
        answerForm.addEventListener('submit', e => {
          e.preventDefault();
          onReveal(answerInput.value);
        });
      }

      const btnAgain = document.getElementById('btn-again');
      const btnHard = document.getElementById('btn-hard');
      const btnGood = document.getElementById('btn-good');
      if (btnAgain) {
        btnAgain.addEventListener('mouseenter', () => updateGradeSelection(0));
        btnAgain.addEventListener('click', () => {
          updateGradeSelection(0);
          onGrade('again');
        });
      }
      if (btnHard) {
        btnHard.addEventListener('mouseenter', () => updateGradeSelection(1));
        btnHard.addEventListener('click', () => {
          updateGradeSelection(1);
          onGrade('hard');
        });
      }
      if (btnGood) {
        btnGood.addEventListener('mouseenter', () => updateGradeSelection(2));
        btnGood.addEventListener('click', () => {
          updateGradeSelection(2);
          onGrade('good');
        });
      }

      const btnContext = document.getElementById('btn-context');
      if (btnContext) {
        btnContext.addEventListener('click', e => {
          e.stopPropagation();
          toggleContext();
        });
      }

      const btnRoots = document.getElementById('btn-roots');
      if (btnRoots) {
        btnRoots.addEventListener('click', e => {
          e.stopPropagation();
          toggleRoots();
        });
      }

      document.querySelectorAll('.compound-add-btn:not(:disabled)').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const vi = btn.getAttribute('data-vi');
          const en = btn.getAttribute('data-en') || '';
          onAddLegoWord(vi, en, btn);
        });
      });

      document.querySelectorAll('.compound-swap-btn:not(:disabled)').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const vi = btn.getAttribute('data-vi');
          const root = btn.getAttribute('data-root') || '';
          const slotIdx = parseInt(btn.getAttribute('data-slot') || '0', 10);
          const queue = progress.today ? progress.today.queue : [];
          const currentId = queue[0];
          const item = wordMap.get(currentId);
          if (item) {
            onSwapLegoWord(item, vi, root, slotIdx, btn);
          }
        });
      });

      if (focusTarget) {
        const el = document.getElementById(focusTarget);
        if (el) el.focus();
      }
    }

    window.addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;

      if (e.key === 'Escape') {
        const modal = document.getElementById('tm-art-backdrop');
        if (modal && modal.classList.contains('is-active')) {
          e.preventDefault();
          window.closeArtRewardModal();
          return;
        }
      }

      const activeModal = document.getElementById('tm-art-backdrop');
      if (activeModal && activeModal.classList.contains('is-active')) {
        if (e.key === 'ArrowLeft' || e.key === 'Left') {
          e.preventDefault();
          window.navigateArtReward(-1);
          return;
        }
        if (e.key === 'ArrowRight' || e.key === 'Right') {
          e.preventDefault();
          window.navigateArtReward(1);
          return;
        }
        return;
      }

      const queue = progress.today ? progress.today.queue : [];
      if (!queue || queue.length === 0) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') && e.target.id !== 'btn-xong-tiep') return;
        if (e.key === 'Enter' || e.key === ' ' || e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          startNextRound(10);
        }
        return;
      }

      if (isStudyCard(queue[0])) {
        const keyLower = (e.key || '').toLowerCase();
        if (keyLower === 'c' || e.code === 'KeyC') {
          e.preventDefault();
          toggleContext();
          return;
        }
        if (keyLower === 'r' || e.code === 'KeyR') {
          e.preventDefault();
          toggleRoots();
          return;
        }
        if (e.key === 'Enter' || e.key === ' ' || e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          onStudyContinue();
        }
        return;
      }

      if (!revealed) return;

      const keyLower = (e.key || '').toLowerCase();
      if (keyLower === 'c' || e.code === 'KeyC') {
        e.preventDefault();
        toggleContext();
        return;
      }
      if (keyLower === 'r' || e.code === 'KeyR') {
        e.preventDefault();
        toggleRoots();
        return;
      }
      if (keyLower === 'j' || e.code === 'KeyJ' || e.key === 'ArrowLeft') {
        e.preventDefault();
        updateGradeSelection(selectedGradeIndex - 1);
      } else if (keyLower === 'l' || e.code === 'KeyL' || e.key === 'ArrowRight') {
        e.preventDefault();
        updateGradeSelection(selectedGradeIndex + 1);
      } else if (e.key === 'Enter' || e.key === ' ' || e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        const grades = ['again', 'hard', 'good'];
        onGrade(grades[selectedGradeIndex]);
      }
    });

    async function init() {
      loadProgress();
      loadLocalExamplesCache();
      loadLocalRootsCache();
      loadLocalKnownCompounds();
      fetch('/api/tu-moi/examples')
        .catch(() => null)
        .then(res => (res && res.ok) ? res : fetch('examples_cache.json'))
        .then(res => res && res.ok ? res.json() : null)
        .then(data => {
          if (data && typeof data === 'object') {
            const cacheObj = data.cache || data;
            Object.assign(examplesCache, cacheObj);
            saveLocalExamplesCache();
          }
        })
        .catch(() => {});
      fetch('/api/tu-moi/roots-cache')
        .catch(() => null)
        .then(res => (res && res.ok) ? res : fetch('roots_cache.json'))
        .then(res => res && res.ok ? res.json() : null)
        .then(data => {
          if (data && typeof data === 'object') {
            const cacheObj = data.cache || data;
            Object.assign(rootsCache, cacheObj);
            saveLocalRootsCache();
          }
        })
        .catch(() => {});
      fetch('/api/tu-moi/known-compounds')
        .catch(() => null)
        .then(res => (res && res.ok) ? res : fetch('known_compounds.json'))
        .then(res => res && res.ok ? res.json() : null)
        .then(data => {
          if (data && Array.isArray(data.known)) {
            data.known.forEach(k => {
              const norm = cleanVietnameseWord(k);
              if (norm) knownCompounds.add(norm);
            });
            saveLocalKnownCompounds();
          }
        })
        .catch(() => {});
      fetch('/api/tu-moi/art-rewards')
        .catch(() => null)
        .then(res => (res && res.ok) ? res : fetch('rewards_catalog.json'))
        .then(res => res && res.ok ? res.json() : null)
        .then(data => {
          if (data && data.status === 'ok' && Array.isArray(data.catalog) && data.catalog.length > 0) {
            rewardsCatalog = data.catalog;
          } else if (Array.isArray(data) && data.length > 0) {
            rewardsCatalog = data;
          }
        })
        .catch(() => {});
      function mergeIncomingProgress(sp) {
        if (!sp || typeof sp !== 'object') return false;
        let changed = false;
        if (sp.cards && typeof sp.cards === 'object') {
          if (!progress.cards) progress.cards = {};
          for (const [id, inCard] of Object.entries(sp.cards)) {
            const cur = progress.cards[id];
            if (!cur) {
              progress.cards[id] = inCard;
              changed = true;
            } else {
              const inTime = new Date(inCard.last_review || inCard.due || 0).getTime();
              const curTime = new Date(cur.last_review || cur.due || 0).getTime();
              if (inTime >= curTime) {
                progress.cards[id] = inCard;
                changed = true;
              }
            }
          }
        }
        if (sp.days && typeof sp.days === 'object') {
          if (!progress.days) progress.days = {};
          for (const [k, v] of Object.entries(sp.days)) {
            const oldVal = progress.days[k] || 0;
            const newVal = Math.max(oldVal, v || 0);
            if (newVal !== oldVal) {
              progress.days[k] = newVal;
              changed = true;
            }
          }
        }
        if (sp.newDays && typeof sp.newDays === 'object') {
          if (!progress.newDays) progress.newDays = {};
          for (const [k, v] of Object.entries(sp.newDays)) {
            const oldVal = progress.newDays[k] || 0;
            const newVal = Math.max(oldVal, v || 0);
            if (newVal !== oldVal) {
              progress.newDays[k] = newVal;
              changed = true;
            }
          }
        }
        if (sp.weeklyArt && typeof sp.weeklyArt === 'object') {
          progress.weeklyArt = Object.assign({}, sp.weeklyArt, progress.weeklyArt || {});
          changed = true;
        }
        const todayStr = localDateStr();
        if (sp.today && typeof sp.today === 'object') {
          if (!progress.today || (sp.today.date === todayStr && progress.today.date !== todayStr)) {
            progress.today = {
              date: sp.today.date || '',
              queue: Array.isArray(sp.today.queue) ? [...sp.today.queue] : [],
              firstGrade: sp.today.firstGrade && typeof sp.today.firstGrade === 'object' ? { ...sp.today.firstGrade } : {},
              done: Array.isArray(sp.today.done) ? [...sp.today.done] : [],
              studied: sp.today.studied && typeof sp.today.studied === 'object' ? { ...sp.today.studied } : {}
            };
            changed = true;
          } else if (progress.today && sp.today.date === progress.today.date) {
            if (Array.isArray(sp.today.done)) {
              if (!Array.isArray(progress.today.done)) progress.today.done = [];
              const doneSet = new Set(progress.today.done);
              for (const id of sp.today.done) {
                if (!doneSet.has(id)) {
                  progress.today.done.push(id);
                  doneSet.add(id);
                  changed = true;
                }
              }
            }
            if (sp.today.firstGrade && typeof sp.today.firstGrade === 'object') {
              progress.today.firstGrade = Object.assign({}, sp.today.firstGrade, progress.today.firstGrade || {});
            }
            if (sp.today.studied && typeof sp.today.studied === 'object') {
              progress.today.studied = Object.assign({}, sp.today.studied, progress.today.studied || {});
            }
            if (progress.today.done.length === 0 && Object.keys(progress.today.studied || {}).length === 0 && Array.isArray(sp.today.queue) && sp.today.queue.length > 0 && !hasActiveCardInteraction()) {
              progress.today.queue = [...sp.today.queue];
              changed = true;
            }
          }
        }
        const activeId = hasActiveCardInteraction() ? renderedCardId : null;
        saveProgress(false);
        syncTodayPlan(false);
        if (activeId) keepActiveCardFront(activeId);
        render(true);
        return changed;
      }

      async function loadWordsData() {
        try {
          const res = await fetch('words.json');
          if (res.ok) {
            const data = await res.json();
            return Array.isArray(data) ? data : (data && Array.isArray(data.items) ? data.items : null);
          }
        } catch (e) {}
        return null;
      }

      async function loadLocalOrStaticProgress() {
        // 1. Try local Python server API
        try {
          const res = await fetch('/api/tu-moi/progress');
          if (res.ok) {
            const data = await res.json();
            if (data && data.status === 'ok' && data.progress && Object.keys(data.progress.cards || {}).length > 0) {
              return data.progress;
            }
          }
        } catch (e) {}

        // 2. Static progress.json fallback
        try {
          const res = await fetch('progress.json');
          if (res.ok) {
            const data = await res.json();
            if (data && typeof data === 'object' && Object.keys(data.cards || {}).length > 0) {
              return data;
            }
          }
        } catch (e) {}

        return null;
      }

      words = loadSavedWords();
      if (words.length > 0) {
        syncTodayPlan(false);
      }
      render();

      // 1. Load local words and progress immediately for instant 0ms rendering
      const [fetchedWords, fetchedProgress] = await Promise.all([
        loadWordsData(),
        loadLocalOrStaticProgress()
      ]);

      if (fetchedWords && fetchedWords.length > 0) {
        const fetchedIds = new Set(fetchedWords.map(w => w.id));
        const maxStaticDate = fetchedWords.reduce((m, w) => (w.date && w.date > m ? w.date : m), '');
        const extraCached = (words || []).filter(w =>
          w && w.id && !fetchedIds.has(w.id) &&
          ((w.date && w.date > maxStaticDate) || w.en_from === 'lego' || (progress.today && Array.isArray(progress.today.queue) && progress.today.queue.includes(w.id)))
        );
        words = fetchedWords.concat(extraCached);
        saveWords(words);
      }

      if (fetchedProgress) {
        mergeIncomingProgress(fetchedProgress);
      } else {
        const activeId = hasActiveCardInteraction() ? renderedCardId : null;
        syncTodayPlan(false);
        if (activeId) keepActiveCardFront(activeId);
        render(true);
      }

      // 2. Check Google Apps Script Cloud sync in background
      fetch(WORDS_URL + '?action=progress')
        .then(res => res.ok ? res.json() : null)
        .then(data => {
          if (data && data.status === 'ok' && data.progress && Object.keys(data.progress.cards || {}).length > 0) {
            mergeIncomingProgress(data.progress);
          } else {
            // Cloud has no saved progress yet; seed cloud with our current progress
            syncProgressToCloud();
          }
        })
        .catch(() => {});

      // Background check for fresh words in Google Doc
      fetch(WORDS_URL)
        .then(res => res.ok ? res.json() : null)
        .then(data => {
          const onlineItems = Array.isArray(data) ? data : (data && Array.isArray(data.items) ? data.items : null);
          if (onlineItems && onlineItems.length > 0) {
            const cleanOnline = onlineItems.filter(w => {
              if (!w || !w.vi) return false;
              const viLow = w.vi.trim().toLowerCase();
              if (viLow.includes('http://') || viLow.includes('https://')) return false;
              if (/^(january|february|march|april|may|june|july|august|september|october|november|december)$/i.test(viLow)) return false;
              return true;
            });
            if (cleanOnline.length > 0) {
              const activeId = hasActiveCardInteraction() ? renderedCardId : null;
              const localMap = new Map((words || []).map(w => [w.id, w]));
              const onlineIdSet = new Set(cleanOnline.map(w => w.id));
              const updatedOnline = cleanOnline.map(w => {
                const loc = localMap.get(w.id);
                if (loc && loc.vi && loc.en && loc.en_from === 'doc' && w.en_from !== 'doc') {
                  return { ...w, en: loc.en, en_from: loc.en_from };
                }
                if (loc && (loc.vi !== w.vi || (loc.en && loc.en !== w.en))) {
                  return { ...w, vi: loc.vi, en: loc.en };
                }
                return w;
              });
              const preservedLocal = (words || []).filter(w => !onlineIdSet.has(w.id));
              words = [...updatedOnline, ...preservedLocal];
              saveWords(words);
              syncTodayPlan(false);
              if (activeId) keepActiveCardFront(activeId);
              render(true);
            }
          }
        })
        .catch(() => {});
    }

    function checkDayRollover() {
      if (words.length === 0) return;
      const todayStr = localDateStr();
      if (!progress.today || progress.today.date !== todayStr) {
        syncTodayPlan();
        resetTransientCardState();
        render();
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') checkDayRollover();
    });
    window.addEventListener('focus', checkDayRollover);

    init();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('[SW] Registration failed:', err);
        });
      });
    }
  </script>
</body>
