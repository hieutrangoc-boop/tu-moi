<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Từ mới</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5e7f60">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Từ Mới">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f1e9;
      --surface: #fffdf9;
      --sunk: #fbf7f1;
      --fg: #2b2622;
      --muted: #6e655c;
      --line: #efe7dc;
      --line-strong: #e2d7c8;
      --accent: #a04a25;
      --accent-soft: #f4e6da;
      --sage: #5e7f60;
      --sage-soft: #e8f0e6;
      --sage-ink: #3e5a40;
      --flame: #c8562a;
      --shadow: 0 1px 2px rgba(60,40,20,.06), 0 8px 24px rgba(60,40,20,.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1714;
        --surface: #24201c;
        --sunk: #1f1b18;
        --fg: #efe8df;
        --muted: #b3a89b;
        --line: #352f29;
        --line-strong: #463e36;
        --accent: #e59a72;
        --accent-soft: #3a2a20;
        --sage: #9dc09f;
        --sage-soft: #233026;
        --sage-ink: #bfd8c0;
        --flame: #ef8a5a;
        --shadow: 0 1px 2px rgba(0,0,0,.3);
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    button, input {
      font: inherit;
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: box-shadow 0.4s ease;
    }

    @media (min-width: 720px) {
      .card {
        padding: 26px 28px;
      }
    }

    .card.round-glow {
      box-shadow: var(--shadow), 0 0 0 3px var(--sage-soft);
    }

    .header-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
    }

    .title {
      margin: 0;
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 24px;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 14px;
      font-weight: 600;
      color: var(--flame);
      font-variant-numeric: tabular-nums;
      transform-origin: center;
    }

    .streak-badge.pending-today {
      color: var(--muted);
      opacity: 0.6;
    }

    .streak-badge.pop {
      animation: streak-pop 0.5s cubic-bezier(.3,1.6,.5,1);
    }

    .streak-badge svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .cards-left {
      margin-left: auto;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .empty-words {
      color: var(--muted);
    }

    .card-panel {
      width: 100%;
      min-height: 92px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--sunk);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 6px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .card-panel.revealed {
      background: var(--accent-soft);
      border-color: transparent;
      transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .card-panel.revealed.panel-reward-full {
      background: var(--sage-soft);
      border: 1px solid var(--sage);
      animation: tmPanelPulseFull 400ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-panel.revealed.panel-reward-partial {
      border: 1px solid var(--accent);
      animation: tmPanelPulsePartial 400ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes tmPanelPulseFull {
      0% {
        box-shadow: 0 0 0 0 transparent;
      }
      40% {
        box-shadow: 0 0 0 5px var(--sage-soft);
      }
      100% {
        box-shadow: 0 0 0 0 transparent;
      }
    }

    @keyframes tmPanelPulsePartial {
      0% {
        box-shadow: 0 0 0 0 transparent;
      }
      40% {
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      100% {
        box-shadow: 0 0 0 0 transparent;
      }
    }

    .prompt-main {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 24px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .prompt-sub {
      font-size: 17px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .prompt-revealed-row {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px 10px;
      max-width: 100%;
    }

    .prompt-en-beside {
      font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      font-weight: 400;
      color: var(--muted);
    }

    .typed-echo {
      font-size: 15px;
      color: var(--muted);
      overflow-wrap: anywhere;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .typed-echo.match-full {
      color: var(--sage-ink);
      font-weight: 500;
    }

    .typed-echo.match-partial {
      color: var(--accent);
      font-weight: 500;
    }

    .typed-echo.match-none {
      color: var(--muted);
      opacity: 0.75;
      text-decoration: line-through;
      text-decoration-color: var(--line-strong);
    }

    .typed-echo.skipped {
      color: var(--muted);
      font-style: italic;
      opacity: 0.8;
      text-decoration: none;
    }

    .accuracy-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-style: normal;
      user-select: none;
      flex-shrink: 0;
    }

    .accuracy-mark.check {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: var(--sage);
      color: var(--surface);
      font-size: 11px;
      font-weight: 700;
      animation: tmPopCheck 380ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .accuracy-mark.partial {
      padding: 0 4px;
      height: 17px;
      border-radius: 4px;
      background: var(--line-strong);
      color: var(--fg);
      font-size: 12px;
      font-weight: 600;
    }

    @keyframes tmPopCheck {
      0% {
        transform: scale(0.4);
        opacity: 0;
      }
      70% {
        transform: scale(1.18);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .answer-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .answer-input {
      flex: 1;
      width: 100%;
      min-width: 0;
      padding: 11px 14px;
      font-size: 16px; /* Prevents iOS Safari zoom-on-focus */
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      background: var(--sunk);
      color: var(--fg);
    }

    .primary-btn {
      padding: 11px 18px;
      border-radius: 12px;
      background: var(--fg);
      color: var(--surface);
      font-weight: 600;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .primary-btn.is-skip {
      background: var(--line);
      color: var(--muted);
      border: 1px solid var(--line-strong);
      font-weight: 500;
    }

    .primary-btn.is-skip:hover {
      background: var(--line-strong);
      color: var(--fg);
    }

    .primary-btn.full {
      width: 100%;
    }

    .grade-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }

    .grade-btn {
      padding: 10px;
      border-radius: 12px;
      font-weight: 600;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      text-align: center;
      transition: all 0.12s ease;
    }

    .grade-btn.is-active,
    .grade-btn:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
      box-shadow: 0 0 0 2px var(--bg, #fff), 0 4px 12px rgba(0,0,0,0.08);
      transform: translateY(-1px);
    }

    .grade-hint {
      font-family: var(--font-mono, monospace);
      font-size: 0.75em;
      opacity: 0.5;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .grade-again {
      color: var(--accent);
      border-color: var(--accent);
    }
    .grade-again:hover {
      background: var(--accent-soft);
    }

    .grade-hard {
      color: var(--muted);
      border-color: var(--line-strong);
    }
    .grade-hard:hover {
      background: var(--sunk);
    }

    .grade-good {
      color: var(--sage-ink);
      border-color: var(--sage);
    }
    .grade-good:hover {
      background: var(--sage-soft);
    }

    .context-trigger-row {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .context-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .context-btn:hover {
      color: var(--fg);
      border-color: var(--line-strong);
      background: var(--sunk);
    }
    .context-btn.is-open {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .context-hint {
      display: inline-block;
      font-family: var(--font-mono, monospace);
      font-size: 11px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--sunk);
      border: 1px solid var(--line);
      color: var(--muted);
      line-height: 1.2;
    }
    .context-btn.is-open .context-hint {
      background: transparent;
      border-color: currentColor;
      color: inherit;
    }

    .context-box {
      width: 100%;
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: contextFadeIn 0.15s ease-out;
    }

    @keyframes contextFadeIn {
      from { opacity: 0; transform: translateY(-2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .example-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .example-vi {
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--fg);
    }
    .example-vi b,
    .example-vi strong {
      color: var(--accent);
      font-weight: 600;
    }

    .example-en {
      font-size: 13px;
      line-height: 1.35;
      color: var(--muted);
    }

    .context-loading,
    .context-error {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      padding: 6px 0;
    }
    .context-error {
      color: var(--accent);
    }

    .roots-box {
      width: 100%;
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: contextFadeIn 0.15s ease-out;
    }

    .roots-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .roots-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .roots-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .root-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--sunk);
      border: 1px solid var(--line);
      font-size: 13px;
    }

    .root-pill-vi {
      font-weight: 600;
      color: var(--accent);
    }

    .root-pill-sep {
      color: var(--line-strong);
      font-size: 11px;
    }

    .root-pill-meaning {
      color: var(--fg);
    }

    .roots-bridge {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      font-size: 13px;
      line-height: 1.45;
      color: var(--fg);
      font-style: italic;
    }

    .roots-bridge-icon {
      font-style: normal;
      font-size: 13px;
      flex-shrink: 0;
      line-height: 1.45;
    }

    .roots-bridge-text {
      flex: 1;
    }

    .compounds-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .compound-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--sunk);
      border: 1px solid var(--line);
    }

    .compound-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .compound-vi-line {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .compound-vi {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--fg);
    }

    .compound-literal {
      font-size: 12px;
      color: var(--muted);
    }

    .compound-en {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.3;
    }

    .compound-add-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--fg);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s ease;
      flex-shrink: 0;
    }

    .compound-add-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .compound-action {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .compound-swap-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s ease;
      flex-shrink: 0;
    }

    .compound-swap-btn:hover:not(:disabled) {
      color: var(--fg);
      border-color: var(--line-strong);
      background: var(--sunk);
    }

    .compound-swap-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .round-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pips {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 3px;
    }

    .pip {
      height: 6px;
      border-radius: 2px;
      background: var(--line-strong);
      transition: background-color 0.25s ease;
    }

    .pip.filled {
      background: var(--accent);
    }

    .round-row.sage-complete .pip {
      background: var(--sage);
    }

    .round-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      transition: color 0.25s ease;
    }

    .round-row.sage-complete .round-count {
      color: var(--sage);
    }

    .week-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-col {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .day-stack {
      min-height: 48px;
      height: 48px;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      padding-bottom: 2px;
      box-sizing: border-box;
    }

    .round-block {
      width: 100%;
      max-width: 28px;
      height: 6px;
      border-radius: 2px;
      background: var(--sage);
      flex-shrink: 0;
    }

    .round-overflow-badge {
      font-size: 9px;
      font-weight: 700;
      color: var(--sage);
      line-height: 1;
      padding: 1px 3px;
      border-radius: 4px;
      background: var(--sage-soft);
      margin-bottom: 1px;
      flex-shrink: 0;
    }

    .round-block.drop-in {
      animation: block-drop 0.45s cubic-bezier(.3,1.5,.5,1);
    }

    .day-letter {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      padding-top: 4px;
      border-top: 3px solid transparent;
      line-height: 1.2;
    }

    .day-letter.in-streak {
      border-top-color: var(--flame);
    }

    .day-letter.is-today {
      color: var(--accent);
    }

    .reward-pot-row {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .reward-pot-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: transparent;
      transition: background-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }

    button.reward-pot-text.is-unlocked,
    .reward-pot-text.is-unlocked {
      appearance: none;
      -webkit-appearance: none;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.3;
      color: #92580c;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(217, 119, 6, 0.32);
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
      animation: tmRewardGlow 2.8s ease-in-out infinite alternate;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      padding: 6px 14px;
      min-height: 38px;
    }

    button.reward-pot-text.is-unlocked:hover,
    .reward-pot-text.is-unlocked:hover {
      background: rgba(245, 158, 11, 0.2);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.38);
      transform: translateY(-1px);
    }

    button.reward-pot-text.is-unlocked:active,
    .reward-pot-text.is-unlocked:active {
      transform: scale(0.96);
      background: rgba(245, 158, 11, 0.28);
    }

    @keyframes tmRewardGlow {
      0% {
        box-shadow: 0 0 6px rgba(245, 158, 11, 0.15);
        border-color: rgba(217, 119, 6, 0.25);
      }
      100% {
        box-shadow: 0 0 16px rgba(245, 158, 11, 0.38);
        border-color: rgba(217, 119, 6, 0.55);
      }
    }

    @media (prefers-color-scheme: dark) {
      .reward-pot-text.is-unlocked {
        color: #fcd34d;
        background: rgba(245, 158, 11, 0.16);
        border-color: rgba(245, 158, 11, 0.42);
        box-shadow: 0 0 14px rgba(245, 158, 11, 0.25);
      }
    }

    /* Vietnamese Masterpiece Modal */
    .tm-art-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 16, 12, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;

  <script type="module">
    import { fsrs, createEmptyCard, Rating } from 'https://cdn.jsdelivr.net/npm/ts-fsrs@5.4.2/+esm';

    let progress = {

      if (revealed) return true;

    function keepActiveCardFront(cardId) {
      if (!cardId || !progress.today || !Array.isArray(progress.today.queue)) return;
      if (!wordMap.has(cardId)) return;
      if (Array.isArray(progress.today.done) && progress.today.done.includes(cardId)) return;
      const idx = progress.today.queue.indexOf(cardId);
      if (idx > 0) {
        progress.today.queue.splice(idx, 1);
        progress.today.queue.unshift(cardId);
      }
    }
    let roundCelebrate = false;
    let celebrateTimer = null;
    let animateNewBlock = false;
    let animateStreakPop = false;
    let rewardCelebrate = false;
    let rewardCelebrateTimer = null;

      {
        id: "choi-o-an-quan",
        milestone: "7 vòng luyện tập kiên trì đã hoàn tất! Chúc mừng bạn đã chạm tay vào kho tàng tinh hoa văn hóa và nét đẹp mộc mạc quê hương.",
        title: "Chơi ô ăn quan (Children Playing Mandarin Square)",

        image: "rewards/choi_o_an_quan.jpg"

        milestone: "Tuyệt vời! Bạn đã tích lũy đủ 7 vòng bền bỉ trong tuần này—minh chứng cho sự chuyên tâm và gắn kết lâu dài.",
        title: "Vườn xuân Trung Nam Bắc (Spring Garden of North, Central, and South) — Bảo vật quốc gia",
        artist: "Nguyễn Gia Trí",
        year: "1969–1989 · Sơn mài (Lacquer on wood)",

    function localDateStr(d = new Date()) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function endOfToday(d = new Date()) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59, 999);
    }

    function reviveCard(raw) {
      if (!raw || typeof raw !== 'object') return createEmptyCard(new Date());
      const c = { ...raw };
      c.due = c.due ? new Date(c.due) : new Date();
      if (c.last_review) {
        c.last_review = new Date(c.last_review);
      }
      return c;
    }

    function loadSavedWords() {
      try {
        const raw = localStorage.getItem(STORAGE_WORDS_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
        if (parsed && Array.isArray(parsed.items)) return parsed.items;
      } catch (err) {
        // Ignore storage errors
      }
      return [];
    }

    function saveWords(items) {
      try {
        localStorage.setItem(STORAGE_WORDS_KEY, JSON.stringify(items));
      } catch (err) {
        // Ignore storage errors
      }
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_PROGRESS_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return;

        const cards = {};
        if (parsed.cards && typeof parsed.cards === 'object') {
          for (const [id, c] of Object.entries(parsed.cards)) {
            cards[id] = reviveCard(c);
          }
        }

        progress = {
          cards,
          days: parsed.days && typeof parsed.days === 'object' ? { ...parsed.days } : {},
          newDays: parsed.newDays && typeof parsed.newDays === 'object' ? { ...parsed.newDays } : {},
          today: parsed.today && typeof parsed.today === 'object' ? {
            date: parsed.today.date || '',
            queue: Array.isArray(parsed.today.queue) ? [...parsed.today.queue] : [],
            firstGrade: parsed.today.firstGrade && typeof parsed.today.firstGrade === 'object' ? { ...parsed.today.firstGrade } : {},
            done: Array.isArray(parsed.today.done) ? [...parsed.today.done] : [],
            studied: parsed.today.studied && typeof parsed.today.studied === 'object' ? { ...parsed.today.studied } : {}
          } : null
        };
      } catch (err) {
        // Ignore storage errors
      }
    }

    function pruneHistoryMap(mapObj, maxDays = 14) {
      const keys = Object.keys(mapObj).sort((a, b) => b.localeCompare(a));
      for (let i = maxDays; i < keys.length; i++) {
        delete mapObj[keys[i]];
      }
    }

    let syncTimeout = null;
    function syncProgressToServer() {
      if (syncTimeout) clearTimeout(syncTimeout);
      syncTimeout = setTimeout(() => {
        try {
          fetch('/api/tu-moi/progress', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ progress })
          }).catch(() => {});
        } catch (e) {}
      }, 400);
    }

    let syncCloudTimeout = null;
    function syncProgressToCloud() {
      if (syncCloudTimeout) clearTimeout(syncCloudTimeout);
      syncCloudTimeout = setTimeout(() => {
        try {
          fetch(WORDS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'saveProgress', progress })
          }).catch(() => {});
        } catch (e) {}
      }, 800);
    }

    function saveProgress(syncServer = true) {
      pruneHistoryMap(progress.days, 14);
      pruneHistoryMap(progress.newDays, 14);
      try {
        localStorage.setItem(STORAGE_PROGRESS_KEY, JSON.stringify(progress));
      } catch (err) {
        // Ignore storage errors
      }
      if (syncServer) {
        syncProgressToServer();
        syncProgressToCloud();
      }
    }

    function pickNewWordsAlternatingDates(unseenList, limit, initialLastDate = null) {
      if (limit <= 0 || unseenList.length === 0) return [];

      // Group by date, newest date first
      const byDate = new Map();
      for (const w of unseenList) {
        const d = w.date || '';
        if (!byDate.has(d)) byDate.set(d, []);
        byDate.get(d).push(w);
      }

      const sortedDates = Array.from(byDate.keys()).sort((a, b) => b.localeCompare(a));
      const picked = [];
      let lastDate = initialLastDate;

      while (picked.length < limit) {
        let chosenDate = null;
        for (const d of sortedDates) {
          const bucket = byDate.get(d);
          if (bucket && bucket.length > 0 && d !== lastDate) {
            chosenDate = d;
            break;
          }
        }
        if (chosenDate === null) {
          for (const d of sortedDates) {
            const bucket = byDate.get(d);
            if (bucket && bucket.length > 0) {
              chosenDate = d;
              break;
            }
          }
        }
        if (chosenDate === null) break;

        const word = byDate.get(chosenDate).shift();
        picked.push(word);
        lastDate = chosenDate;
      }

      return picked;
    }

    function syncTodayPlan(syncServer = true) {
      wordMap = new Map(words.map(w => [w.id, w]));
      if (words.length === 0) return;

      const now = new Date();
      const todayStr = localDateStr(now);
      const todayEndMs = endOfToday(now).getTime();

      if (!progress.today || progress.today.date !== todayStr) {
        progress.today = {
          date: todayStr,
          queue: [],
          firstGrade: {},
          done: [],
          studied: {}
        };

        // 1. Reviews first: every word that is due, most overdue first
        const dueReviews = words
          .filter(w => {
            const c = progress.cards[w.id];
            return c && new Date(c.due).getTime() <= todayEndMs;
          })
          .sort((a, b) => new Date(progress.cards[a.id].due).getTime() - new Date(progress.cards[b.id].due).getTime())
          .map(w => w.id);

        // 2. New words: up to NEW_PER_DAY, newest date first, alternating dates
        const usedNew = progress.newDays[todayStr] || 0;
        const quota = Math.max(0, NEW_PER_DAY - usedNew);
        const unseen = words.filter(w => !progress.cards[w.id]);
        const newWords = pickNewWordsAlternatingDates(unseen, quota, null);
        const newIds = [];

        for (const w of newWords) {
          progress.cards[w.id] = createEmptyCard(now);
          progress.newDays[todayStr] = (progress.newDays[todayStr] || 0) + 1;
          newIds.push(w.id);
        }

        // 3. Mix ~1 new word after every 2 reviews while both are available
        const mixed = [];
        let r = 0;
        let n = 0;
        while (r < dueReviews.length && n < newIds.length) {
          mixed.push(dueReviews[r++]);
          if (r < dueReviews.length) {
            mixed.push(dueReviews[r++]);
          }
          mixed.push(newIds[n++]);
        }
        while (r < dueReviews.length) mixed.push(dueReviews[r++]);
        while (n < newIds.length) mixed.push(newIds[n++]);

        progress.today.queue = mixed;
        saveProgress(syncServer);
      } else {
        // Same day: filter valid IDs and top up new words if new words arrived in doc
        const doneSet = new Set(progress.today.done);
        progress.today.queue = progress.today.queue.filter(id => wordMap.has(id) && !doneSet.has(id));

        const usedNew = progress.newDays[todayStr] || 0;
        const quota = Math.max(0, NEW_PER_DAY - usedNew);
        if (quota > 0) {
          const inQueue = new Set(progress.today.queue);
          const unseen = words.filter(w => !progress.cards[w.id] && !inQueue.has(w.id) && !doneSet.has(w.id));
          if (unseen.length > 0) {
            const lastId = progress.today.queue[progress.today.queue.length - 1];
            const lastDate = lastId && wordMap.has(lastId) ? wordMap.get(lastId).date : null;
            const added = pickNewWordsAlternatingDates(unseen, quota, lastDate);
            for (const w of added) {
              progress.cards[w.id] = createEmptyCard(now);
              progress.newDays[todayStr] = (progress.newDays[todayStr] || 0) + 1;
              progress.today.queue.push(w.id);
            }
            saveProgress(syncServer);
          }
        }
      }
    }

    function getWeekInfo() {
      const now = new Date();
      const todayIdx = (now.getDay() + 6) % 7; // Monday = 0 .. Sunday = 6
      const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - todayIdx);
      const dayNames = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
      const dayLetters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

      const cols = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        const dateStr = localDateStr(d);
        const count = progress.days[dateStr] || 0;
        const rounds = Math.floor(count / 10);
        cols.push({
          index: i,
          dateStr,
          name: dayNames[i],
          letter: dayLetters[i],
          rounds,
          isToday: i === todayIdx
        });
      }

      const todayHasRound = cols[todayIdx].rounds >= 1;
      const endIdx = todayHasRound ? todayIdx : todayIdx - 1;
      const streakSet = new Set();
      let streak = 0;

      if (endIdx >= 0 && cols[endIdx].rounds >= 1) {
        for (let j = endIdx; j >= 0; j--) {
          if (cols[j].rounds >= 1) {
            streakSet.add(j);
            streak++;
          } else {
            break;
          }
        }
      }

      const fullWeek = cols.every(c => c.rounds >= 1);
      return { cols, streak, streakSet, todayHasRound, fullWeek };
    }

    function getAudioCtx() {
      try {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return null;
          audioCtx = new Ctx();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      } catch (err) {
        return null;
      }
    }

    function bell(freq, at, dur, vol, type = 'sine') {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const t0 = ctx.currentTime + at;
        const partials = [
          [1, vol],
          [2, vol * 0.18],
          [3, vol * 0.06]
        ];
        for (const [mult, level] of partials) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq * mult, t0);
          gain.gain.setValueAtTime(0.0001, t0);
          gain.gain.linearRampToValueAtTime(Math.max(0.0002, level), t0 + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t0);
          osc.stop(t0 + dur + 0.02);
        }
      } catch (err) {
        // Ignore audio errors
      }
    }

    function unlockAudioOnFirstTouch() {
      const unlock = () => {
        const ctx = getAudioCtx();
        if (ctx && ctx.state === 'suspended') {

        }
        window.removeEventListener('touchstart', unlock, true);
        window.removeEventListener('pointerdown', unlock, true);
        window.removeEventListener('click', unlock, true);
      };
      window.addEventListener('touchstart', unlock, { capture: true, passive: true });
      window.addEventListener('pointerdown', unlock, { capture: true, passive: true });
      window.addEventListener('click', unlock, { capture: true, passive: true });
    }

    function getRewardPotInfo(week) {
      const totalWeeklyRounds = week.cols.reduce((sum, col) => sum + col.rounds, 0);
      const rewardsEarned = Math.floor(totalWeeklyRounds / 7);
      const nextTarget = (rewardsEarned + 1) * 7;
      let text = '';
      if (rewardsEarned === 0) {
        text = `${totalWeeklyRounds} / 7 rounds this week`;
      } else if (rewardsEarned === 1) {
        if (totalWeeklyRounds === 7) {
          text = `1 reward unlocked! (7 / 7 rounds)`;
        } else {
          text = `1 reward unlocked · ${totalWeeklyRounds} / 14 rounds`;
        }
      } else {
        if (totalWeeklyRounds % 7 === 0) {
          text = `${rewardsEarned} rewards unlocked! (${totalWeeklyRounds} / ${totalWeeklyRounds} rounds)`;
        } else {
          text = `${rewardsEarned} rewards unlocked · ${totalWeeklyRounds} / ${nextTarget} rounds`;
        }
      }
      return {
        totalWeeklyRounds,
        rewardsEarned,
        nextTarget,
        text
      };
    }

    function getMondayDateStr(dateObj) {
      const d = dateObj || new Date();
      const todayIdx = (d.getDay() + 6) % 7; // Monday = 0
      const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - todayIdx);
      return localDateStr(monday);
    }

    let currentArtIndex = 0;

    function getWeeklyMasterpieces(mondayStr) {
      if (!progress.weeklyArt) progress.weeklyArt = {};
      const key = mondayStr || getMondayDateStr();
      let assigned = progress.weeklyArt[key];

      // Backward-compatibility: normalize string to array
      if (typeof assigned === 'string') {
        assigned = [assigned];
        progress.weeklyArt[key] = assigned;
      } else if (!Array.isArray(assigned)) {
        assigned = [];
        progress.weeklyArt[key] = assigned;
      }

      const week = getWeekInfo();
      const rewardPot = getRewardPotInfo(week);
      const neededCount = Math.max(1, rewardPot.rewardsEarned);

      // Collect all artworks used across other weeks so far
      const otherWeeksUsed = [];
      for (const [k, v] of Object.entries(progress.weeklyArt)) {
        if (k !== key) {
          if (Array.isArray(v)) otherWeeksUsed.push(...v);
          else if (typeof v === 'string') otherWeeksUsed.push(v);
        }
      }

      let mutated = false;
      while (assigned.length < neededCount) {
        // Pool candidate paintings not yet in this week's assigned list
        let pool = rewardsCatalog.filter(a => !assigned.includes(a.id));
        // Prefer candidate paintings not recently used in other weeks either
        const freshPool = pool.filter(a => !otherWeeksUsed.includes(a.id));
        if (freshPool.length > 0) pool = freshPool;
        if (pool.length === 0) pool = rewardsCatalog;

        const picked = pool[Math.floor(Math.random() * pool.length)] || rewardsCatalog[0];
        assigned.push(picked.id);
        mutated = true;
      }

      if (mutated) saveProgress();

      // Resolve IDs to catalog objects
      const resolved = assigned.map(id => rewardsCatalog.find(a => a.id === id)).filter(Boolean);
      return resolved.length > 0 ? resolved : [rewardsCatalog[0]];
    }

    function stripDiacritics(str) {
      return String(str || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[đĐ]/g, m => m === 'Đ' ? 'D' : 'd')
        .trim()
        .toLowerCase();
    }

    function cleanVietnameseWord(str) {
      return String(str || '')
        .trim()
        .toLowerCase()
        .replace(/[.,/#!$%^&*;:{}=\-_`~()?"'<>]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .normalize('NFC');
    }

    function checkAccuracy(targetVi, typedVi) {
      const normTyped = cleanVietnameseWord(typedVi);
      if (!normTyped) return null;
      const strippedTyped = stripDiacritics(normTyped);

      const targetCleanNoParens = String(targetVi || '').replace(/\([^)]*\)/g, ' ');
      const splitParts = targetCleanNoParens.split(/[=/;,:]|\s*[-—]\s*/);
      const rawAlternatives = [
        targetVi,
        targetCleanNoParens,
        targetCleanNoParens.replace(/[-—]/g, ' '),
        ...splitParts
      ];
      const alternatives = rawAlternatives
        .map(alt => cleanVietnameseWord(alt))
        .filter(alt => alt.length > 0);

      // 1. Full match: all letters & tone marks exact
      for (const alt of alternatives) {
        if (alt === normTyped) {
          return 'full';
        }
      }

      // 2. Partial match: all base letters match without tone marks / diacritics
      for (const alt of alternatives) {
        if (stripDiacritics(alt) === strippedTyped) {
          return 'partial';
        }
      }

      return null;
    }

      escaped = escaped.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

    function isCompoundKnown(vi) {
      const norm = cleanVietnameseWord(vi);
      if (!norm) return false;
      return knownCompounds.has(norm);

    function isWordInList(vi) {
      const norm = cleanVietnameseWord(vi);
